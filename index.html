<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, responsive page built with Tailwind CSS."
    />
    <title>Tailwind Starter</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 font-sans text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-5xl items-center px-6 py-16">
      <section id="get-started" class="max-w-2xl">
        <p class="mb-4 text-sm font-semibold uppercase tracking-[0.2em] text-indigo-600">
          Tailwind starter
        </p>
        <h1 class="text-4xl font-bold tracking-tight sm:text-6xl">
          A simple HTML page, ready to build on.
        </h1>
        <p class="mt-6 text-lg leading-8 text-slate-600">
          This page uses Tailwind CSS from the CDN, so you can start styling immediately without any setup.
        </p>
        <a
          class="mt-8 inline-flex rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2"
          href="#get-started"
        >
          Get started
        </a>
      </section>
    </main>
  </body>
</html>
